# Tests and types on every pull request.
#
# Separate from deploy.yml on purpose: this one runs on untrusted contributions, so it is
# the workflow that must never see a Cloudflare credential. It has none, and needs none —
# the suite runs against a local D1 and `wrangler types` reads a local config file.
#
# It is also the check to make required once `main` is protected.
#
# Pull requests only. It ran on main as well until that turned out to be two workflows
# racing to do the same work: deploy.yml runs the same test and typecheck steps before it
# touches Cloudflare, so a green tick here on main proved nothing that a failed deploy
# would not have caught anyway — and it ran in parallel rather than in front, so it was
# not a gate either.

name: ci

on:
  pull_request:

permissions:
  contents: read

# A superseded pull-request run is wasted work, unlike a superseded deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job name is `ci` because every other AiratTop repository names it that, and it is the
  # context a branch ruleset would require. A required check that names a job which does
  # not exist never reports, and a pull request waits on it forever.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      # Chrome is preinstalled on GitHub's Ubuntu runners; the suite starts wrangler dev
      # against a local D1, so it needs no credential and no network.
      - run: npm run test:e2e
      # public_html/vendor/ and THIRD_PARTY_NOTICES.md are built from package.json and
      # committed; a rebuild that changes them means someone forgot `npm run vendor`.
      - name: vendor is up to date
        run: npm run vendor && git diff --exit-code -- public_html/vendor THIRD_PARTY_NOTICES.md
