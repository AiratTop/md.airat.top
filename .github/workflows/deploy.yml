# Deploy on push to main.
#
# A GitHub Action rather than Cloudflare's Git integration (Workers Builds), for one
# reason: this project has a D1 database since share links were added. Workers Builds
# deploys the Worker but does not apply migrations, so a push that adds a column would
# ship code expecting a schema that does not exist yet. Here the migration runs first and
# a failure stops the deploy. The Workers Builds connection has to stay disconnected, or
# both deploy every push and race each other.
#
# Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN   — scoped to Workers Scripts:Edit and D1:Edit
#   CLOUDFLARE_ACCOUNT_ID  — spares wrangler looking the account up through the token

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing here writes to the repository. Stated rather than inherited, because the default
# for a token is broader than a deploy needs.
permissions:
  contents: read

# A deploy that begins finishes. Two runs overlapping would race the migration against
# the deploy of the run that replaced it.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # `workflow_dispatch` lets a run be started against any branch, which would otherwise
    # be a way to migrate and deploy code that never passed through the protected branch.
    # Only the owner can start one today, so this guards against the slip rather than the
    # attack — a wrong selection in a dropdown.
    if: github.ref == 'refs/heads/main'
    steps:
      # Actions are pinned to a commit rather than a tag. A tag is a pointer its owner can
      # move, and these two run with access to the Cloudflare token; a full SHA is the only
      # immutable way to name what will execute.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Before anything is touched in Cloudflare, and the only gate on a push to main —
      # ci.yml deliberately does not run here, because two workflows running the same
      # steps in parallel is duplicated work and gates nothing. The suite runs in workerd
      # against a local D1, so a failure here is a real failure rather than a mock
      # disagreeing.
      - name: test
        run: npm test

      - name: typecheck
        run: npm run typecheck

      # Migrations are additive by convention, so this is safe to run before the code that
      # uses them is live. The reverse order is not.
      - name: apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: deploy worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
